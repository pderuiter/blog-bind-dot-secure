---
# BIND 9.18 (Ubuntu 24.04) is enough for the DoT listener. DoT forwarding needs BIND 9.20:
# set bind_dot_forwarding: true together with bind_install_source: isc.
bind_install_source: distro
bind_install_min_version: "{{ '9.20' if bind_dot_forwarding | bool else '9.18' }}"

# Name in the self-signed certificate (use your resolver's DNS name).
bind_dot_server_name: dns.example.com

# Clients allowed to query and recurse (acl trusted).
bind_dot_trusted_networks:
  - localhost
  - 192.168.0.0/16
  - 10.0.0.0/8

# Forward all queries to Cloudflare over DoT (BIND 9.20+).
bind_dot_forwarding: false

# Install the nftables ruleset from the post (replaces /etc/nftables.conf).
bind_dot_nftables: false
